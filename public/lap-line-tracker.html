<!DOCTYPE html>
<html>

<head>
    <title>Lap Tracker</title>
    <style>
        body {
            background: #02040a;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        .grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
            flex-wrap: wrap;
        }

        .btn {
            background: #22c55e;
            color: black;
            padding: 40px;
            border-radius: 15px;
            border: none;
            font-size: 1.5rem;
            min-width: 250px;
            cursor: pointer;
        }

        .btn:active {
            background: #16a34a;
        }
    </style>
</head>

<body>
    <div id="auth" style="margin-top: 100px;">
        <input type="password" id="key" placeholder="Observer Key">
        <button onclick="login()">Login</button>
    </div>
    <div id="ui" style="display:none;">
        <h1>🏎️ Lap Tracker</h1>
        <div id="grid" class="grid"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function login() { socket.emit("login", { roleType: "laptracker", key: document.getElementById("key").value }); }
        socket.on("authSuccess", () => { document.getElementById("auth").style.display = "none"; document.getElementById("ui").style.display = "block"; });

        socket.on("state", (s) => {
            if (!s.currentRace) {
                document.getElementById("grid").innerHTML = "<h2>Oota võistluse algust...</h2>";
                return;
            }
            document.getElementById("grid").innerHTML = s.currentRace.drivers.map((d, i) => `
                <button class="btn" onclick="socket.emit('lap', ${i})">
                    ${d.name}<br>#${d.car}
                </button>
            `).join("");
        });
    </script>
</body>

</html>
