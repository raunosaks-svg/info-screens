<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Race Countdown</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .time {
            font-size: 120px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h1>⏱ Countdown</h1>

    <div id="time" class="time">--</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io();

        socket.on("state", (state) => {

            document.getElementById("time").textContent = state.timer;

        });

    </script>

</body>

</html>
