<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Race Flags</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        #flag {
            width: 100vw;
            height: 100vh;
        }

        .chequered {
            background-color: white;
            background-image: linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black),
                linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
        }

        #fs-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button id="fs-btn" onclick="document.documentElement.requestFullscreen()">Fullscreen</button>
    <div id="flag"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const flagDiv = document.getElementById("flag");
        socket.on("state", (state) => {
            flagDiv.className = "";
            flagDiv.style.background = "";
            if (state.raceMode === "safe") flagDiv.style.background = "green";
            else if (state.raceMode === "hazard") flagDiv.style.background = "yellow";
            else if (state.raceMode === "danger") flagDiv.style.background = "red";
            else if (state.raceMode === "finish") flagDiv.className = "chequered";
        });
    </script>
</body>

</html>
