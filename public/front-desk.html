<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Front Desk</title>
    <style>
        body {
            background: #050a18;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
        }

        .login-box {
            background: #0d1117;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: inline-block;
        }

        input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            margin-right: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            background: #f0f6fc;
            color: black;
            font-weight: bold;
        }

        .ui-hidden {
            display: none;
        }

        /* See osa vastutab selle eest, et lisatud draiverid oleks näha */
        #temp-list {
            margin: 20px auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            min-height: 20px;
        }

        .temp-item {
            border-bottom: 1px solid #222;
            padding: 5px;
            display: flex;
            justify-content: space-between;
        }

        .session-card {
            background: #161b22;
            margin: 10px auto;
            padding: 15px;
            border-radius: 5px;
            width: fit-content;
            min-width: 300px;
        }
    </style>
</head>

<body>

    <div id="auth" class="login-box">
        <h1>Front Desk Login</h1>
        <input type="password" id="key" placeholder="••••">
        <button onclick="doLogin()">Enter</button>
        <p id="msg" style="color: #f85149;"></p>
    </div>

    <div id="main" class="ui-hidden">
        <h1>Front Desk</h1>

        <div style="margin-bottom: 20px;">
            <input type="text" id="name" placeholder="Sõitja nimi">
            <input type="number" id="car" placeholder="Auto #" style="width: 70px;">
            <button onclick="addDriver()">Add Driver</button>
            <button onclick="submitSession()" style="background: #238636; color: white;">Create Session</button>
        </div>

        <div id="temp-list">
            <em style="color: #555;">Draiverite nimekiri on tühi...</em>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 40px 0;">

        <h2>Aktiivsed Sessioonid</h2>
        <div id="session-list"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentDrivers = []; // Massiiv, mis hoiab draivereid ENNE serverisse saatmist

        // Sisselogimine
        function doLogin() {
            const pass = document.getElementById("key").value;
            socket.emit("login", { roleType: "frontdesk", key: pass });
        }

        socket.on("authSuccess", () => {
            document.getElementById("auth").classList.add("ui-hidden");
            document.getElementById("main").classList.remove("ui-hidden");
        });

        socket.on("authError", (m) => document.getElementById("msg").innerText = m);

        // FUNKTSIOON: Lisab draiveri nimekirja ja uuendab visuaali kohe
        function addDriver() {
            const nInput = document.getElementById("name");
            const cInput = document.getElementById("car");

            if (nInput.value && cInput.value) {
                // Lisame andmed massiivi
                currentDrivers.push({ name: nInput.value, car: cInput.value });

                // Tühjendame kastid
                nInput.value = "";
                cInput.value = "";

                // Jookseme nimekirja uuesti üle, et see ekraanile ilmuks
                renderTempList();
            } else {
                alert("Täida mõlemad väljad!");
            }
        }

        // FUNKTSIOON: See joonistab "Add Driver" nimed ekraanile
        function renderTempList() {
            const listDiv = document.getElementById("temp-list");
            if (currentDrivers.length === 0) {
                listDiv.innerHTML = '<em style="color: #555;">Draiverite nimekiri on tühi...</em>';
                return;
            }

            listDiv.innerHTML = currentDrivers.map((d, index) => `
                <div class="temp-item">
                    <span>${d.name} (#${d.car})</span>
                    <span style="color: red; cursor: pointer;" onclick="removeTemp(${index})">Eemalda</span>
                </div>
            `).join("");
        }

        function removeTemp(index) {
            currentDrivers.splice(index, 1);
            renderTempList();
        }

        // Saada terve sessioon serverisse
        function submitSession() {
            if (currentDrivers.length > 0) {
                socket.emit("addSession", currentDrivers);
                currentDrivers = []; // Puhastame nimekirja
                renderTempList();
            } else {
                alert("Lisa vähemalt üks sõitja!");
            }
        }

        // Kui serverist tulevad uuendused sessioonide kohta
        socket.on("state", (s) => {
            const sList = document.getElementById("session-list");
            sList.innerHTML = s.sessions.map((sess, i) => `
                <div class="session-card">
                    <strong>Sessioon #${i + 1}:</strong> 
                    ${sess.drivers.map(d => `${d.name} (#${d.car})`).join(", ")}
                    <button style="margin-left: 15px; background: #da3633; color: white; padding: 2px 5px;" 
                            onclick="socket.emit('deleteSession', ${i})">Delete</button>
                </div>
            `).join("");
        });
    </script>
</body>

</html>
