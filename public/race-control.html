<!DOCTYPE html>
<html>

<head>
    <title>Race Control</title>
</head>

<body>

    <h1>Race Control</h1>

    <button onclick="startRace()">Start Race</button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        function startRace() {
            socket.emit("updateRace", {
                status: "racing",
                currentLap: 1
            });
        }
    </script>

</body>

</html>
