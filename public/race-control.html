<!DOCTYPE html>
<html>

<head>
    <title>Race Control</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            width: 80%;
            max-width: 600px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #startButton {
            background: #ffd54f;
        }

        #racingButton {
            background: #4caf50;
            color: white;
        }

        #finishButton {
            background: #f44336;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="panel">
        <h1>Race Control</h1>

        <div class="buttons">
            <button id="startButton">Start Countdown</button>
            <button id="racingButton">Set Racing</button>
            <button id="finishButton">Finish Race</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const startButton = document.getElementById("startButton");
        const finishButton = document.getElementById("finishButton");
        const racingButton = document.getElementById("racingButton");

        startButton.addEventListener("click", () => {
            socket.emit("startCountdown");
        });

        finishButton.addEventListener("click", () => {
            socket.emit("updateRace", { status: "finished" });
        });

        racingButton.addEventListener("click", () => {
            socket.emit("updateRace", { status: "racing" });
        });
    </script>

</body>

</html>
