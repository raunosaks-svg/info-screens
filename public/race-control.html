<!DOCTYPE html>
<html>

<head>
    <title>Race Control</title>
</head>

<body>

    <h1>Race Control</h1>

    <button onclick="startCountdown()">Start Countdown</button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        function startCountdown() {
            socket.emit("startCountdown");
        }
    </script>

</body>

</html>
