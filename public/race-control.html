<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Race Control</title>
    <style>
        body {
            background: #0b0e14;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: center;
            width: 400px;
        }

        .controls {
            display: none;
        }

        .status-bar {
            background: #0d1117;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }

        .safe {
            background: #238636;
        }

        .hazard {
            background: #d29922;
            color: black;
        }

        .danger {
            background: #da3633;
        }

        .finish {
            background: #ffffff;
            color: black;
            border: 2px dashed black;
        }

        #timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
        }

        .active-label {
            color: #238636;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div id="auth" class="card">
        <h1>Race Control</h1>
        <input type="password" id="key"
            style="padding: 10px; width: 80%; background: #0d1117; color: white; border: 1px solid #30363d;">
        <br><br>
        <button onclick="doLogin()" style="padding: 10px 20px; cursor: pointer;">Login</button>
    </div>

    <div id="main" class="card controls">
        <h2>Safety Official Panel</h2>

        <div class="status-bar">
            <div id="race-active-status" class="active-label">Sessioon ootel</div>
            <div style="margin: 10px 0;">Staatuse režiim: <span id="curMode" style="font-weight: bold;">-</span></div>
            <div id="timer-display">Aeg: --:--</div>
        </div>

        <button id="start-btn" onclick="socket.emit('startRace')"
            style="width: 100%; padding: 15px; background: #238636; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 20px;">
            🚀 START NEXT RACE
        </button>

        <div class="mode-grid">
            <button class="mode-btn safe" onclick="socket.emit('setMode', 'safe')">Safe</button>
            <button class="mode-btn hazard" onclick="socket.emit('setMode', 'hazard')">Hazard</button>
            <button class="mode-btn danger" onclick="socket.emit('setMode', 'danger')">Danger</button>
            <button class="mode-btn finish" onclick="socket.emit('setMode', 'finish')">Finish</button>
        </div>

        <br>
        <button onclick="socket.emit('endRace')"
            style="background: #30363d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">End
            Session</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function doLogin() {
            socket.emit("login", { roleType: "racecontrol", key: document.getElementById("key").value });
        }

        socket.on("authSuccess", () => {
            document.getElementById("auth").style.display = "none";
            document.getElementById("main").style.display = "block";
        });

        socket.on("state", (s) => {
            // Uuendame režiimi teksti ja värvi
            const modeEl = document.getElementById("curMode");
            modeEl.innerText = s.raceMode.toUpperCase();
            if (s.raceMode === 'safe') modeEl.style.color = "#238636";
            else if (s.raceMode === 'hazard') modeEl.style.color = "#d29922";
            else if (s.raceMode === 'danger') modeEl.style.color = "#da3633";

            // Uuendame taimerit
            const mins = Math.floor(s.timer / 60);
            const secs = s.timer % 60;
            document.getElementById("timer-display").innerText = `Aeg: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

            // Kontrollime, kas sõit on aktiivne
            const statusLabel = document.getElementById("race-active-status");
            const startBtn = document.getElementById("start-btn");

            if (s.currentRace) {
                statusLabel.innerText = "● SÕIT ON AKTIIVNE";
                statusLabel.style.color = "#238636";
                startBtn.style.opacity = "0.5";
                startBtn.disabled = true;
            } else {
                statusLabel.innerText = "Sessioon ootel";
                statusLabel.style.color = "#8b949e";
                startBtn.style.opacity = "1";
                startBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
