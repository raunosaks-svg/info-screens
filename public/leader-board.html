<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Board - Beachside Racetrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="public-display">
        <button onclick="toggleFullscreen()" class="fullscreen-btn">⛶ Fullscreen</button>
        
        <div class="leaderboard-container">
            <div class="race-info">
                <div class="timer-display">
                    <div id="timer" class="large-timer">10:00</div>
                </div>
                <div id="flag-status" class="flag-status">⚫ Ready</div>
            </div>
            
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Car #</th>
                        <th>Driver</th>
                        <th>Fastest Lap</th>
                        <th>Current Lap</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('public-connect');
        
        socket.on('leaderboard-update', (drivers) => {
            updateLeaderboard(drivers);
        });
        
        socket.on('timer-update', (timer) => {
            const minutes = Math.floor(timer.remaining / 60);
            const seconds = timer.remaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        });
        
        socket.on('race-mode-changed', (data) => {
            const flagStatus = document.getElementById('flag-status');
            const modeText = {
                'safe': '🟢 Safe - Racing',
                'hazard': '🟡 Hazard - Caution',
                'danger': '🔴 Danger - Stopped',
                'finish': '🏁 Finish - Return to Pits'
            };
            flagStatus.textContent = modeText[data.mode] || '⚫ Ready';
        });
        
        socket.on('race-started', (race) => {
            updateLeaderboard(race.drivers);
        });
        
        function updateLeaderboard(drivers) {
            const tbody = document.getElementById('leaderboard-body');
            
            tbody.innerHTML = drivers.map((driver, index) => `
                <tr>
                    <td class="position">${index + 1}</td>
                    <td class="car-number">#${driver.carNumber}</td>
                    <td class="driver-name">${driver.name}</td>
                    <td class="lap-time">${driver.fastestLap ? driver.fastestLap.toFixed(3) + 's' : '--'}</td>
                    <td class="current-lap">L${driver.currentLap || 0}</td>
                </tr>
            `).join('');
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
