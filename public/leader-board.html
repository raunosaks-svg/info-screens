<!DOCTYPE html>
<html>

<head>
    <title>Leader Board</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            width: 80%;
            max-width: 700px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 42px;
        }

        .item {
            font-size: 28px;
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        #status {
            font-weight: bold;
        }

        #fastestLap {
            color: #ffd54f;
        }
    </style>
</head>

<body>
    <div class="board">
        <h1>Leader Board</h1>

        <div class="item" id="status">Status: waiting</div>
        <div class="item" id="countdown">Countdown: 10</div>
        <div class="item" id="lap">Lap: 0/5</div>
        <div class="item" id="fastestLap">Fastest Lap: none</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        socket.on("raceState", (data) => {
            let statusText = "";

            if (data.status === "waiting") {
                statusText = "Waiting for race";
            } else if (data.status === "countdown") {
                statusText = "Race starting soon";
            } else if (data.status === "racing") {
                statusText = "Race in progress";
            } else if (data.status === "finished") {
                statusText = "Race finished";
            } else {
                statusText = data.status;
            }

            document.getElementById("status").innerText = "Status: " + statusText;
            document.getElementById("countdown").innerText = "Countdown: " + data.countdown;
            document.getElementById("lap").innerText = "Lap: " + data.currentLap + "/" + data.totalLaps;

            if (data.fastestLap === null) {
                document.getElementById("fastestLap").innerText = "Fastest Lap: none";
            } else {
                document.getElementById("fastestLap").innerText = "Fastest Lap: " + data.fastestLap;
            }
        });
    </script>

</body>

</html>
