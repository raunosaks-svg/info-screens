<!DOCTYPE html>
<html>

<head>
    <title>Leader Board</title>
</head>

<body>

    <h1>Leader Board</h1>

    <div id="status"></div>
    <div id="lap"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        socket.on("raceState", (data) => {
            document.getElementById("status").innerText = "Status: " + data.status;
            document.getElementById("lap").innerText = "Lap: " + data.currentLap + "/" + data.totalLaps;
        });
    </script>

</body>

</html>
