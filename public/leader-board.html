<!DOCTYPE html>
<html>

<head>
    <title>Leaderboard</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th {
            border-bottom: 1px solid #333;
            padding: 10px;
            color: #888;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #222;
            font-size: 1.2rem;
        }

        .mode-info {
            margin: 10px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <h1>🏆 Leaderboard</h1>
    <div id="info" class="mode-info">Mode: - | Time: -</div>
    <table>
        <thead>
            <tr>
                <th>Driver</th>
                <th>Car</th>
                <th>Lap</th>
                <th>Fastest</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on("state", (s) => {
            document.getElementById("info").innerText = `Mode: ${s.raceMode} | Time: ${s.timer}`;
            if (!s.currentRace) return;
            const sorted = [...s.currentRace.drivers].sort((a, b) => (a.fastestLap || 999) - (b.fastestLap || 999));
            document.getElementById("rows").innerHTML = sorted.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.car}</td>
                    <td>${d.laps}</td>
                    <td>${d.fastestLap ? d.fastestLap.toFixed(3) : '-'}</td>
                </tr>
            `).join("");
        });
    </script>
</body>

</html>
