<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Next Race</title>

    <style>
        body {
            margin: 0;
            background: #020617;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            width: 60%;
            margin: auto;
        }

        .driver {
            font-size: 24px;
            margin: 10px 0;
        }

        .msg {
            margin-top: 20px;
            font-size: 20px;
            color: #22c55e;
        }
    </style>
</head>

<body>

    <h1>⏭ Next Race</h1>

    <div id="content"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io();

        socket.on("state", (state) => {

            const content = document.getElementById("content");

            let next = null;

            if (state.currentRace) {
                next = state.sessions[0];
            } else {
                next = state.sessions[0];
            }

            if (!next) {
                content.innerHTML = "<h2>No upcoming races</h2>";
                return;
            }

            let html = `
        <div class="card">
            <h2>Upcoming Race</h2>
            ${next.drivers.map(d =>
                `<div class="driver">${d.name} (#${d.car})</div>`
            ).join("")}
        </div>
    `;

            // pärast finish
            if (state.raceMode === "finish") {
                html += `<div class="msg">Proceed to paddock</div>`;
            }

            content.innerHTML = html;

        });

    </script>

</body>

</html>
